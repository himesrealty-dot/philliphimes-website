# No SPA catch-all: this is a static multi-page site, so unknown paths
# must return a real 404 (Netlify auto-serves /404.html) instead of the
# homepage with a 200 — avoids soft-404s and duplicate-content noise.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ── The Front Porch (members' area): keep it out of search entirely ──
# Header rather than a robots.txt Disallow, for two reasons:
#   1. robots.txt is public — listing the paths advertises exactly what's
#      private (same reasoning as the .md 404 rules above).
#   2. Disallow BLOCKS crawling, which means the noindex tag is never read.
#      A URL discovered elsewhere could still be indexed as a bare link.
# X-Robots-Tag is read on fetch and is authoritative. The pages also carry
# a <meta name="robots"> tag as belt-and-braces.
# NOTE: this is search hygiene, NOT access control. Real member data must be
# rendered server-side behind auth — never baked into a static file.
# Listed per page, NOT as /front-porch* — deliberately, even though all four
# pages currently carry the same rule and a wildcard would be shorter.
# The guest pass was briefly built as an indexable lead magnet, and a
# /front-porch* wildcard silently overrode its page-level <meta robots> so it
# could never have ranked. That plan was dropped (the Porch is members-only,
# see FRONT-PORCH-OPS.md), so pass.html is noindex again on purpose — but the
# per-page form is kept so the next page added to this family has to opt in
# explicitly rather than inherit a rule nobody re-read.
[[headers]]
  for = "/front-porch.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/front-porch-pass.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/front-porch-vendors.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Referrer-Policy = "no-referrer"

# Cache images for a week (satisfies PageSpeed "efficient cache lifetimes").
# CSS/JS are intentionally left on Netlify's revalidate default so edits go
# live instantly during active development.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[build]
  publish = "."

[functions]
  included_files = ["data/**"]
