<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Closing Timeline | Phil Himes</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&family=Playfair+Display:ital@1&display=swap">
<style>
/* Layout: one 760px reading column. Navy hero with progress, then a vertical timeline, then the closing checklists. */
:root{
  --navy:#1B3A5C; --navy-dk:#122840; --gold:#C9A455; --gold-dk:#8A6E2C; --teal:#186E82;
  --ink:#1A1A2E; --body:#333333; --muted:#495057; --line:#E9ECEF; --wash:#F5F7F9; --bg:#FFFFFF;
  --good:#1E7F4F; --risk:#A23B3B; --cream:#FBF7EE;
  --f-head:"Montserrat",system-ui,sans-serif; --f-body:"Open Sans",system-ui,sans-serif; --f-accent:"Playfair Display",Georgia,serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--body);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-head);color:var(--ink);text-wrap:balance;margin:0}
a{color:var(--teal)}
.bar{background:var(--navy);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.bar .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:10px;gap:12px}
.bar img{height:32px;width:auto;display:block}
.bar .logo-txt{color:#fff;font-family:var(--f-head);font-weight:800;letter-spacing:.5px}
.bar .ph{color:#fff;font-weight:700;font-size:15px;user-select:all}
.hero{background:var(--navy);color:#fff}
.hero .wrap{padding-block:30px 26px;display:flex;flex-direction:column;gap:8px}
.badge{align-self:flex-start;background:var(--gold);color:var(--navy-dk);font-family:var(--f-head);font-weight:800;font-size:11px;letter-spacing:2px;padding:5px 10px;border-radius:3px}
.hero h1{color:#fff;font-size:clamp(28px,6vw,40px);line-height:1.1}
.hero .addr{font-weight:700}
.hero .addr span{font-weight:400;opacity:.85}
.hero .lead{font-family:var(--f-accent);font-style:italic;font-size:clamp(18px,4vw,22px);line-height:1.45;color:#F1E3C0;margin-top:4px}
.keydates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.kd{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:10px 12px;min-width:0}
.kd small{display:block;font-family:var(--f-head);font-weight:700;font-size:10px;letter-spacing:1.5px;color:var(--gold)}
.kd b{display:block;font-family:var(--f-head);font-size:17px;line-height:1.2;margin-top:2px}
@media (max-width:560px){.keydates{grid-template-columns:1fr}}
.prog{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.prog .track{height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--gold);border-radius:4px}
.prog span{font-size:13px;color:#E9ECEF}
section{padding-block:28px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--f-head);font-weight:700;font-size:11px;letter-spacing:2.5px;color:var(--teal);text-transform:uppercase}
h2{font-size:22px;margin-top:4px}
.sub{color:var(--muted);margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.star{color:var(--gold-dk);font-weight:800}
ol.tl{list-style:none;margin:18px 0 0;padding:0;position:relative}
ol.tl::before{content:"";position:absolute;left:15px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ms{position:relative;padding:0 0 22px 48px}
.ms:last-child{padding-bottom:0}
.dot{position:absolute;left:4px;top:2px;width:24px;height:24px;border-radius:12px;background:#fff;border:2px solid #ADB5BD;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
.ms.done .dot{background:var(--good);border-color:var(--good)}
.ms.now .dot{background:var(--gold);border-color:var(--gold)}
.ms .when{font-family:var(--f-head);font-weight:700;font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;font-variant-numeric:tabular-nums}
.ms h3{font-size:18px;margin-top:2px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pill{font-family:var(--f-head);font-weight:800;font-size:10px;letter-spacing:1px;padding:2px 7px;border-radius:3px;color:#fff;white-space:nowrap}
.pill.done{background:var(--good)} .pill.now{background:var(--gold);color:var(--navy-dk)} .pill.call{background:var(--navy)}
.ms p{margin:6px 0 0}
.box{margin-top:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.box{grid-template-columns:1fr}}
.cell{background:var(--wash);border-radius:6px;padding:10px 12px;font-size:14px;line-height:1.5;min-width:0}
.cell small{display:block;font-family:var(--f-head);font-weight:700;font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
.cell.you{background:var(--cream)}
.cell.you small{color:var(--gold-dk)}
.ms.now .cell.you{outline:2px solid var(--gold)}
.upd{margin-top:10px;border-left:3px solid var(--teal);padding:6px 0 6px 12px;font-size:14px}
.upd b{font-family:var(--f-head);font-size:11px;letter-spacing:1px;color:var(--teal);text-transform:uppercase;display:block}
.warn{background:#FCEFEF;border:2px solid var(--risk);border-radius:8px;padding:16px 18px;margin-top:16px}
.warn h3{color:var(--risk);font-size:17px}
.warn p{margin:6px 0 0}
.warn .num{font-weight:700;color:var(--ink);user-select:all}
.lists{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:680px){.lists{grid-template-columns:1fr}}
.list{border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.list h3{font-size:15px}
.list ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.list li{padding-left:20px;position:relative}
.list li::before{content:"";position:absolute;left:3px;top:8px;width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.person{background:var(--wash);border-radius:6px;padding:12px 14px;font-size:14px}
.person small{display:block;font-family:var(--f-head);font-weight:700;font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.person b{font-family:var(--f-head);color:var(--ink)}
.person .num{user-select:all}
.note{font-size:13px;color:var(--muted);margin-top:12px}
footer{background:var(--wash);font-size:12px;color:var(--muted);line-height:1.5}
footer .wrap{padding-block:20px}
</style>
</head>
<body>

<!--
  HOW TO USE THIS TEMPLATE
  1. BUYER version. Copy this folder to /closing/<street-slug>/ the day the contract is signed.
     (Seller version: /closing/_template/.)
  2. Edit only the JSON in <script id="closing-data">. Every milestone date is calculated from
     "contract". Always check the dates against the executed contract; put any date that differs
     in "overrides".
  3. As milestones finish, add their ids to "completed". The next one is marked "Happening now".
  4. Put anything the buyer should know about a milestone in "updates" (e.g. the repair agreement).
  Milestone ids: accepted, earnest, inspection, option, title, appraisal, insurance, financing, prep, walkthrough, closing, after
  "titleDays" (optional, default 20) sets when the title commitment, survey and HOA documents are expected.
-->
<script id="closing-data" type="application/json">
{
  "buyer": "Sample Buyer",
  "address": "123 Example Lane",
  "cityStateZip": "League City, TX 77573",
  "logo": "/images/logo.png",

  "contract": {
    "effective": "2026-11-12",
    "optionDays": 7,
    "financing": "Conventional",
    "financingDays": 21,
    "titleDays": 20,
    "closing": "2026-12-18",
    "possession": "At closing and funding"
  },

  "overrides": {},

  "completed": ["accepted"],

  "updates": {},

  "lender": {"company": "Example Mortgage", "officer": "Loan officer name", "phone": "(281) 000-0000"},

  "title": {"company": "Example Title Company", "officer": "Escrow officer name", "phone": "(281) 000-0000", "address": "Title office address"},

  "agent": {"name": "Phillip Himes", "phone": "(832) 338-4561", "phoneRaw": "8323384561", "email": "phil@philliphimes.com", "office": "2600 South Shore Blvd. Ste 300, League City, TX 77573"}
}
</script>

<div id="app"></div>

<script>
(function(){
  var D = JSON.parse(document.getElementById('closing-data').textContent);
  var C = D.contract, A = D.agent, T = D.title || {}, L = D.lender || {};
  var cash = /cash/i.test(C.financing || '');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function d(s){return new Date(s+'T12:00:00')}
  function add(dt,n){var x=new Date(dt);x.setDate(x.getDate()+n);return x}
  function fmt(dt){return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
  function iso(dt){return dt.toISOString().slice(0,10)}
  // Paragraph 5: earnest money and option fee are due within 3 calendar days (effective date = Day 0).
  // If Day 3 lands on a Saturday, Sunday or legal holiday, it rolls to the end of the next day that isn't one.
  // Legal holidays here = federal holidays (with the Monday observance when one falls on a Sunday).
  // Any other date the contract or title treats differently goes in "overrides".
  function nth(y,m,dow,n){var x=new Date(y,m,1,12);while(x.getDay()!==dow)x.setDate(x.getDate()+1);x.setDate(x.getDate()+7*(n-1));return x}
  function last(y,m,dow){var x=new Date(y,m+1,0,12);while(x.getDay()!==dow)x.setDate(x.getDate()-1);return x}
  function holidays(y){
    var fixed=[[0,1],[5,19],[6,4],[10,11],[11,25]].map(function(a){var x=new Date(y,a[0],a[1],12);if(x.getDay()===0)x.setDate(x.getDate()+1);return x});
    return fixed.concat([nth(y,0,1,3),nth(y,1,1,3),last(y,4,1),nth(y,8,1,1),nth(y,9,1,2),nth(y,10,4,4)]).map(function(x){return x.toDateString()});
  }
  function businessDeadline(dt){var x=new Date(dt);while(x.getDay()===0||x.getDay()===6||holidays(x.getFullYear()).indexOf(x.toDateString())>-1)x.setDate(x.getDate()+1);return x}
  var eff = d(C.effective), close = d(C.closing), optEnd = add(eff, +C.optionDays || 0);
  var earnestDue = businessDeadline(add(eff,3));

  // The SOP (Buyer SOP, chapter 7): each milestone, when it happens, what the buyer does, what Phil handles. star = Phil calls.
  var M = [
    {id:'accepted', star:true, title:'Offer accepted', date:eff,
      what:'The contract is signed by everyone. Every date on this page counts from today, the effective date.',
      you:'Get your earnest money and option fee to the title company, and keep your inspection appointment.',
      phil:'Sends the contract to the title company and your lender, books your inspection inside the option period, and builds this timeline.'},
    {id:'earnest', date:earnestDue, when:'Due by end of day',
      what:'Your earnest money and option fee are due at the title company.',
      you:'Deliver both by this date. Before you wire anything, call the title company at the number on this page and confirm the instructions by voice.',
      phil:'Confirms the title company received both on time.'},
    {id:'inspection', date:add(eff,4), range:[add(eff,1),add(optEnd,-1)], when:'During the option period',
      what:'Your inspector goes through the home top to bottom. This is your due diligence window.',
      you:'Come for the last 30 minutes so the inspector can walk you through what they found.',
      phil:'Schedules access with the listing agent and goes through the report with you.'},
    {id:'option', star:true, title:'Option period ends', date:optEnd, when:'5:00 p.m.',
      what:'Until 5:00 p.m. today you can walk away for any reason. After that, the contract has teeth.',
      you:'Decide with Phil: move forward as is, ask for repairs or a credit, or walk away.',
      phil:'Negotiates any repair request and gets any notice delivered before the deadline.'},
    {id:'title', date:add(eff,+C.titleDays||20), when:'First 2 to 3 weeks',
      what:'The title company sends the title commitment, and you receive the survey and the HOA documents.',
      you:'Nothing, unless Phil calls. He’ll tell you anything worth knowing about the HOA rules and fees.',
      phil:'Reviews the title commitment, survey and HOA documents, and objects to anything that needs fixing before the deadline.'},
    {id:'appraisal', date:add(eff,18), range:[add(eff,14),add(eff,21)], when:'About 2 to 3 weeks in', skip:cash,
      what:'Your lender sends an appraiser to confirm the home’s value.',
      you:'Nothing. Phil calls you if the value comes in low.',
      phil:'Follows up with your lender until the report is in.'},
    {id:'insurance', date:add(close,-21), when:'About 3 weeks before closing',
      what:cash?'Your homeowner’s insurance needs to start the day the home becomes yours.':'Your lender needs proof of homeowner’s insurance before closing.',
      you:'Shop and bind your policy. On the coast, wind and flood can be separate policies; make sure you have every one you need.',
      phil:cash?'Reminds you before closing if the policy isn’t in place.':'Confirms your lender has proof of insurance.'},
    {id:'financing', date:add(eff,+C.financingDays||21), title:'Loan approval', skip:cash,
      what:'The deadline for your loan’s final approval.',
      you:'Until closing: no new credit, no big purchases, no job changes, and answer your lender’s requests the same day.',
      phil:'Checks in with your loan officer every week until approval.'},
    {id:'prep', star:true, title:'Getting ready to close', date:add(close,-10), when:'About 10 days before closing',
      what:cash?'Closing is scheduled, and the title company prepares your settlement figures.':'Closing is scheduled. Your lender sends the Closing Disclosure at least 3 business days before closing.',
      you:cash?'Review your figures with Phil. Set up electric, water and internet in your name starting closing day.':'Review your Closing Disclosure with Phil. Set up electric, water and internet in your name starting closing day.',
      phil:'Schedules closing and the final walkthrough, and makes sure any agreed repairs are done, with receipts.'},
    {id:'walkthrough', date:add(close,-1), range:[add(close,-2),add(close,-1)], when:'1 to 2 days before closing',
      what:'You walk through the home one last time to confirm its condition and any agreed repairs.',
      you:'Plan on about 30 minutes. Run the faucets, appliances, and heat and air.',
      phil:'Walks through with you and checks the repairs against the receipts.'},
    {id:'closing', star:true, title:'Closing day', date:close,
      what:cash?'You sign, the funds transfer, and the home is yours.':'You sign, your loan funds, and the home is yours.',
      you:'Bring photo ID for every buyer. Make sure your funds have reached the title company, confirmed by phone.',
      phil:'Is there with you, and takes your closing photo.'},
    {id:'after', star:true, title:'After closing', date:add(close,30), when:'About 30 days later',
      what:'You’re settled in.',
      you:'File your homestead exemption with the county appraisal district. Change the locks and the garage and gate codes.',
      phil:'Checks in, helps you file the homestead exemption, and would be grateful for a Google review if he earned it.'}
  ].filter(function(m){return !m.skip});
  var TITLES = {earnest:'Earnest money and option fee',inspection:'Your inspection',title:'Title, survey and HOA documents',appraisal:'Appraisal',insurance:'Homeowner’s insurance',walkthrough:'Final walkthrough'};
  M.forEach(function(m){ m.title = m.title || TITLES[m.id] || m.id; });

  var ov = D.overrides || {};
  M.forEach(function(m){ if(ov[m.id]){ m.date=d(ov[m.id]); m.range=null; } });
  M.sort(function(a,b){return a.date-b.date});
  var done = D.completed || [];
  var nowIdx = -1;
  M.forEach(function(m,i){ m.done = done.indexOf(m.id)>-1; if(!m.done && nowIdx<0) nowIdx=i; });

  var h = '';
  h += '<div class="bar"><div class="wrap">'+(D.logo?'<img src="'+esc(D.logo)+'" alt="Phillip Himes Real Estate">':'<span class="logo-txt">PHILLIP HIMES</span>')+'<span class="ph">'+esc(A.phone)+'</span></div></div>';

  var pct = Math.round(100*M.filter(function(m){return m.done}).length/M.length);
  h += '<header class="hero"><div class="wrap"><span class="badge">UNDER CONTRACT</span>'+
    '<h1>Your road to closing</h1>'+
    '<div class="addr">'+esc(D.address)+' <span>'+esc(D.cityStateZip)+'</span></div>'+
    '<div class="lead">Every step between now and closing, with the date it happens and what, if anything, you need to do.</div>'+
    '<div class="keydates">'+
      '<div class="kd"><small>CONTRACT SIGNED</small><b>'+fmt(eff)+'</b></div>'+
      '<div class="kd"><small>OPTION PERIOD ENDS</small><b>'+fmt(optEnd)+'</b></div>'+
      '<div class="kd"><small>CLOSING</small><b>'+fmt(close)+'</b></div>'+
    '</div>'+
    '<div class="prog"><div class="track" role="img" aria-label="'+pct+'% of steps complete"><i style="width:'+pct+'%"></i></div><span>'+M.filter(function(m){return m.done}).length+' of '+M.length+' steps complete'+(nowIdx>-1?' · Next: '+esc(M[nowIdx].title):'')+'</span></div>'+
    '</div></header><main>';

  h += '<section><div class="wrap"><div class="eyebrow">The timeline</div><h2>What happens, and when</h2>'+
    '<p class="sub">You don’t need to track any of this. Phil watches every deadline. The steps marked with a star are when he’ll call you.</p>'+
    '<div class="legend"><span><span class="star">★</span> Phil calls you</span><span>Gold box: what you do</span></div><ol class="tl">';
  M.forEach(function(m,i){
    var st = m.done?'done':(i===nowIdx?'now':'');
    var when = (m.range? fmt(m.range[0])+' – '+fmt(m.range[1]) : fmt(m.date)) + (m.when?' · '+m.when:'');
    var title = m.title;
    h += '<li class="ms '+st+'"><div class="dot" aria-hidden="true">'+(m.done?'✓':'')+'</div>'+
      '<div class="when">'+esc(when)+'</div>'+
      '<h3>'+(m.star?'<span class="star" aria-label="Phil calls you">★</span>':'')+esc(title)+
        (m.done?'<span class="pill done">DONE</span>':(i===nowIdx?'<span class="pill now">HAPPENING NOW</span>':''))+'</h3>'+
      '<p>'+esc(m.what)+'</p>'+
      '<div class="box"><div class="cell you"><small>What you do</small>'+esc(m.you)+'</div><div class="cell"><small>What Phil is handling</small>'+esc(m.phil)+'</div></div>'+
      ((D.updates||{})[m.id]?'<div class="upd"><b>Update</b>'+esc(D.updates[m.id])+'</div>':'')+
      '</li>';
  });
  h += '</ol></div></section>';

  h += '<section><div class="wrap"><div class="eyebrow">Closing day</div><h2>Before you close</h2>'+
    '<div class="warn" role="note"><h3>Protect your money from wire fraud</h3>'+
    '<p>Criminals send fake emails that look like they come from the title company, with new wire instructions. <strong>Never send or accept a wire based on an email.</strong> Before any money moves, call the title company at the number below, which Phil gave you, and confirm the instructions by voice.</p>'+
    (T.phone?'<p class="num">'+esc(T.company)+' · '+esc(T.phone)+'</p>':'')+
    '<p>Phil will never send you wire instructions. If anyone emails you new ones, call the title company before you do anything.</p></div>'+
    '<div class="lists">'+
      '<div class="list"><h3>Bring to the title company</h3><ul><li>Photo ID for every buyer</li><li>Your funds to close, by wire or cashier’s check, with the amount and instructions confirmed by phone with title</li></ul></div>'+
      '<div class="list"><h3>Set up before closing</h3><ul><li>Electric, water and internet in your name, starting closing day</li><li>Homeowner’s insurance, bound and starting closing day</li><li>Mail forwarding to your new address</li></ul></div>'+
      '<div class="list"><h3>After you get the keys</h3><ul><li>Change or re-key the locks</li><li>Reset garage and gate codes</li><li>File your homestead exemption</li></ul></div>'+
    '</div></div></section>';

  h += '<section><div class="wrap"><div class="eyebrow">Who’s who</div><h2>Your closing team</h2><div class="people">'+
    '<div class="person"><small>Your agent</small><b>'+esc(A.name)+'</b><br><span class="num">'+esc(A.phone)+'</span><br>'+esc(A.email)+'</div>'+
    (L.company?'<div class="person"><small>Your lender</small><b>'+esc(L.company)+'</b><br>'+esc(L.officer)+'<br><span class="num">'+esc(L.phone)+'</span></div>':'')+
    (T.company?'<div class="person"><small>Title company</small><b>'+esc(T.company)+'</b><br>'+esc(T.officer)+'<br><span class="num">'+esc(T.phone)+'</span>'+(T.address?'<br>'+esc(T.address):'')+'</div>':'')+
    '</div><p class="note">Questions about any step? Call or text Phil anytime at '+esc(A.phone)+'.</p></div></section>';

  h += '</main><footer><div class="wrap">'+esc(A.name)+', REALTOR® · Brokered by eXp Realty · '+esc(A.office)+'<br>'+esc(A.phone)+' · '+esc(A.email)+'<br>'+
    'Licensed in Texas · Equal Housing Opportunity. Prepared privately for the buyers of '+esc(D.address)+
    '. Dates are estimates based on the contract and may change; the executed contract controls. Phil is not an attorney and this page is not legal advice.'+
    '<br><a href="https://assets.cdn.filesafe.space/l8dNWKKtBchv50jZJYBL/media/6a9f21b6bbc6015019c5157f.pdf" target="_blank" rel="noopener">Texas Real Estate Commission Information About Brokerage Services</a> · '+
    '<a href="https://assets.cdn.filesafe.space/l8dNWKKtBchv50jZJYBL/media/6a9f2196bcef8b5f2c2e9c78.pdf" target="_blank" rel="noopener">Texas Real Estate Commission Consumer Protection Notice</a></div></footer>';

  document.getElementById('app').innerHTML = h;
  document.title = 'Your Closing Timeline — ' + D.address;

  // Machine-readable schedule for the transaction coordinator agent.
  window.CLOSING_SCHEDULE = M.map(function(m){return {id:m.id,title:m.title,date:iso(m.date),philCalls:!!m.star,done:m.done}});
})();
</script>

</body>
</html>
